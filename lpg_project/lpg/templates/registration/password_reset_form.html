{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié | LPG</title>
  <link rel="stylesheet" href="{% static 'css/styles_admin.css' %}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Réinitialisation du mot de passe</h1>
      <p>Entrez votre adresse email pour recevoir le lien de réinitialisation.</p>
      <form method="post">
        {% csrf_token %}
        <div class="field">
          {{ form.email.label_tag }}
          {{ form.email }}
          {{ form.email.errors }}
        </div>
        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
      </form>
      <p class="auth-footer"><a href="{% url 'login' %}">Retour à la connexion</a></p>
    </div>
  </div>
</body>
</html>
